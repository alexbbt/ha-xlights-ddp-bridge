name: xLights DDP Entity Bridge
version: "0.1.0"
slug: xlights_ddp_bridge
description: >-
  Receive DDP from xLights/FPP and map RGB pixels to Home Assistant light
  entities at a low, configurable update rate. Useful for Govee and other
  smart lights that cannot take full show frame rates.
url: https://github.com/alexbbt/ha-xlights-ddp-bridge/blob/main/README.md
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
ports:
  4048/udp: 4048
ports_description:
  4048/udp: DDP input from xLights or Falcon Player
options:
  hz: 5
  ddp_port: 4048
  ddp_bind: "0.0.0.0"
  lights:
    - entity_id: light.example_pixel_1
    - entity_id: light.example_pixel_2
schema:
  hz: float(0.1,60)
  ddp_port: port
  ddp_bind: str
  lights:
    - entity_id: str
