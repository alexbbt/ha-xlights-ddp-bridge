name: xLights DDP Entity Bridge
version: "0.2.9"
slug: xlights_ddp_bridge
description: >-
  Receive DDP from xLights or Falcon Player and map RGB pixels to Home
  Assistant light entities at a low, configurable update rate. Useful for
  Govee, Hue, and other smart lights that cannot take full show frame rates.
url: https://github.com/alexbbt/ha-xlights-ddp-bridge
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:palette-outline
panel_title: xLights DDP Bridge
panel_admin: false
ports:
  4048/udp: 4048
ports_description:
  4048/udp: DDP input from xLights or Falcon Player
options:
  hz: 5
  ddp_port: 4048
  ddp_bind: "0.0.0.0"
  lights:
    - entity_id: light.example_pixel_1
    - entity_id: light.example_pixel_2
schema:
  hz: float(0.1,60)
  ddp_port: port
  ddp_bind: str
  lights:
    - entity_id: str
