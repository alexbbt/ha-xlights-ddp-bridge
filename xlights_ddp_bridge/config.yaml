---
name: xLights DDP Entity Bridge
version: "0.2.14"
slug: xlights_ddp_bridge
description: >-
  Receive DDP from xLights or Falcon Player and map each RGB pixel to any
  Home Assistant light at a low, configurable update rate. For lights that
  cannot take a full show frame rate.
url: https://github.com/alexbbt/ha-xlights-ddp-bridge
image: ghcr.io/alexbbt/xlights_ddp_bridge
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
hassio_api: true
ingress: true
# Leave ingress_stream unset. The default is false. Stream mode chunks POST
# bodies, and the Web UI needs the full body.
panel_icon: mdi:palette-outline
panel_title: xLights DDP Bridge
panel_admin: false
ports:
  4048/udp: 4048
ports_description:
  4048/udp: DDP input from xLights or Falcon Player
options:
  hz: 2
  ddp_port: 4048
  ddp_bind: "0.0.0.0"
  lights:
    - entity_id: light.example_pixel_1
    - entity_id: light.example_pixel_2
schema:
  hz: float(0.1,60)
  ddp_port: port
  ddp_bind: str
  lights:
    - entity_id: str
