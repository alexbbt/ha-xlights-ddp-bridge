name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Bump version and publish release
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip checks
        id: skip
        run: |
          set -euo pipefail
          MSG=$(git log -1 --pretty=%B)
          {
            echo "commit_msg<<EOF"
            echo "$MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if echo "$MSG" | grep -Eqi '\[skip release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine bump type
        if: steps.skip.outputs.skip != 'true'
        id: bump
        run: |
          set -euo pipefail
          MSG="${{ steps.skip.outputs.commit_msg }}"
          if echo "$MSG" | grep -Eqi '\[major\]|BREAKING CHANGE'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -Eqi '\[minor\]|^feat(\(|:)|^feature:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and write changelog
        if: steps.skip.outputs.skip != 'true'
        id: version
        run: |
          set -euo pipefail
          CONFIG=xlights_ddp_bridge/config.yaml
          DOCKER=xlights_ddp_bridge/Dockerfile
          CURRENT=$(grep -E '^version:' "$CONFIG" | sed -E 's/version:[[:space:]]*"?([^"]+)"?/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"

          if git rev-parse "v${NEW}" >/dev/null 2>&1; then
            echo "Tag v${NEW} already exists; skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

          sed -i -E "s/^version: .*/version: \"${NEW}\"/" "$CONFIG"
          sed -i -E "s/io.hass.version=\"[^\"]+\"/io.hass.version=\"${NEW}\"/" "$DOCKER"
          # Static UI assets use ?v=__ASSET_VERSION__, rewritten at serve time from config.yaml

          # Commits since previous release tag (fallback: last 20 on main)
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi

          # Collect user-facing commits; drop bot release bumps
          mapfile -t COMMITS < <(
            git log "${RANGE}" --pretty=format:'%h%x09%s' --no-merges \
              | grep -Eiv $'^[0-9a-f]+\tchore: release v' \
              | grep -Eiv $'\\[skip release\\]' \
              || true
          )

          FEATURES=()
          FIXES=()
          DOCS=()
          OTHER=()

          clean_subject() {
            local s="$1"
            s=$(echo "$s" | sed -E 's/[[:space:]]*\[(major|minor|skip release)\][[:space:]]*//Ig')
            s=$(echo "$s" | sed -E 's/^(feat|fix|docs|chore|refactor|perf|test|build|ci)(\([^)]*\))?!?:[[:space:]]*//I')
            echo "$s" | sed -E 's/[[:space:]]+$//'
          }

          for line in "${COMMITS[@]+"${COMMITS[@]}"}"; do
            [ -z "${line}" ] && continue
            SHA="${line%%	*}"
            SUBJECT="${line#*	}"
            CLEAN=$(clean_subject "${SUBJECT}")
            [ -z "${CLEAN}" ] && continue
            BULLET="- ${CLEAN} (\`${SHA}\`)"
            if echo "${SUBJECT}" | grep -Eqi '^(feat|feature)(\(|:)|\[minor\]'; then
              FEATURES+=("${BULLET}")
            elif echo "${SUBJECT}" | grep -Eqi '^(fix)(\(|:)|bugfix|hotfix'; then
              FIXES+=("${BULLET}")
            elif echo "${SUBJECT}" | grep -Eqi '^(docs?)(\(|:)|readme|documentation'; then
              DOCS+=("${BULLET}")
            else
              OTHER+=("${BULLET}")
            fi
          done

          if [ ${#FEATURES[@]} -eq 0 ] && [ ${#FIXES[@]} -eq 0 ] && [ ${#DOCS[@]} -eq 0 ] && [ ${#OTHER[@]} -eq 0 ]; then
            SHA=$(git rev-parse --short HEAD)
            SUBJECT=$(clean_subject "$(git log -1 --pretty=%s)")
            OTHER+=("- ${SUBJECT} (\`${SHA}\`)")
          fi

          {
            echo "## ${NEW}"
            echo
            if [ ${#FEATURES[@]} -gt 0 ]; then
              echo "### Features"
              echo
              printf '%s\n' "${FEATURES[@]}"
              echo
            fi
            if [ ${#FIXES[@]} -gt 0 ]; then
              echo "### Fixes"
              echo
              printf '%s\n' "${FIXES[@]}"
              echo
            fi
            if [ ${#DOCS[@]} -gt 0 ]; then
              echo "### Documentation"
              echo
              printf '%s\n' "${DOCS[@]}"
              echo
            fi
            if [ ${#OTHER[@]} -gt 0 ]; then
              echo "### Changes"
              echo
              printf '%s\n' "${OTHER[@]}"
              echo
            fi
          } > /tmp/changelog-section.md

          if ! grep -qE "^## ${NEW}$" CHANGELOG.md; then
            BODY=$(awk '/^# Changelog/{next} {print}' CHANGELOG.md)
            {
              echo "# Changelog"
              echo
              cat /tmp/changelog-section.md
              printf '%s\n' "${BODY}"
            } > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
          fi

          cp /tmp/changelog-section.md /tmp/release-notes.md
          # Soften heading for GitHub release body (title already has version)
          sed -i -E "1s/^## ${NEW}$/## What's changed/" /tmp/release-notes.md

      - name: Commit, tag, and release
        if: steps.skip.outputs.skip != 'true' && steps.version.outputs.exists != 'true'
        env:
          NEW: ${{ steps.version.outputs.new }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xlights_ddp_bridge/config.yaml xlights_ddp_bridge/Dockerfile CHANGELOG.md
          git commit -m "chore: release v${NEW} [skip release]"
          git push origin main
          git tag "v${NEW}"
          git push origin "v${NEW}"

          if [ -f /tmp/release-notes.md ]; then
            NOTES=$(cat /tmp/release-notes.md)
          else
            NOTES=$(awk -v ver="## ${NEW}" '
              $0 == ver {capture=1; next}
              capture && /^## / {exit}
              capture {print}
            ' CHANGELOG.md)
          fi
          if [ -z "${NOTES// }" ]; then
            NOTES="Release v${NEW}"
          fi
          gh release create "v${NEW}" \
            --title "v${NEW}" \
            --notes "${NOTES}"
